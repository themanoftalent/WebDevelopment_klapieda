<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Format Examples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        img {
            border: 3px solid #ccc;
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 20px;
            margin: 10px 0;
        }

        h1, h2 {
            color: #2E8857;
            font-family: 'Courier New', Courier, monospace;
            

        }

        div {
            background-color: #F0F8FF;
            padding: 10px;
            border: 2px solid #ADD8E6;
            margin-bottom: 20px;
            text-align: center;
        }

        span {
            background-color: #FFFACD;
            padding: 10px;
            border: 2px solid #FFD700;
            display: inline-block;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
    <h1>Image JPEG examples </h1>
    </div>
    <p> JPEG format is best for photographs because it compresses colors</p>
    <img src="images/paris.jpg" alt="Paris  JPEG Image" width="300" height="200">
    <span>
    <h2>PNG Image</h2>
    </span>
    <p>PNG format supports transparency and is ideal for icons, logos, or graphics with sharp edges</p>
    <img src="images/icon.jpg" alt="Icon PNG Image" width="300" height="200">
</body>
</html>
